<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Marcela">
    <title>Matricula</title>
</head>
<body>
    <!--  Estilo que se le da a la pagina web-->
    <style>
        body{
            background: linear-gradient(rgb(179, 245, 229), rgb(114, 209, 179));
            }
        blockquote{
            font-family: Helvetica;
        }
        fieldset{
            background: linear-gradient(rgb(249, 135, 239), rgb(236, 187, 231));
        }
    </style>

</body>

<!--  Es el header de la pagina y se va a ver en las 3 paginas-->
    <header>
 <!--  Navegador para abrir los enlaces de las paginas-->
        <nav>
        <ul>
           <li> <a href="" target="_blank">Catequesis</a></li>
             <li><a href="" target="_blank">Matricula</a></li>
             <li><a href="" target="_blank">Galeria</a></li>
        </ul>
        </nav>
        
        <br><br>

    <!--  Codigo para el Logo en svg-->
        <svg width="100" height="100" viewBox="0 0 100 100" xmls="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="40" stroke="#e67e22" stroke-width="4" fill="#f1c40f"></circle>
        <line x1="10" y1="50" x2="90" y2="50" stroke="#c0392b" stroke-width="7"></line>
        <line x1="50" y1="10" x2="50" y2="90" stroke="#c0392b" stroke-width="7"></line>
        </svg>
            
        <h1>Bienvenidos a la Catequesis</h1>
<!--  Audio de fondo el usuario lo puede controlar si lo quiere oir ya que esta en muted-->
        <audio controls autoplay loop muted>
            <source src="Audio/Audio1.mp3" type="audio/mp3">
            <source src="Audio/Audio2.mp3" type="audio/mp3">
        </audio>

    </header>

    <br><br>
    <!--  Cuerpo de la pagina-->
<main>
    
       <form action="/enviar-datos">
<fieldset>

        <h2> Datos del Catequizando</h2>
    
    <label for="Nombre">Nombre Completo:</label>
    <input type="text" name="Nombre" id="Nombre" value="Ej: Juan Pérez Lobo" required placeholder="Nombre completo"> <br><br>
    <label for="Fecha">Fecha de Nacimiento:</label>
    <input type="date" name="Fecha" id="Fecha" value="00/00/000" required> <br><br>
    <label for="Edad">Edad</label>
    <input type="number" name="Edad" id="Edad" min="0" max="99"> <br><br>
    <label for="Cedula">Cedula de identidad</label>
    <input type="tex" name="Cedula" id="Cedula" value="000000000" required placeholder="Digite la cedula"><br><br>
    <label for="Teléfono">Teléfono</label>
    <input type="number" name="Teléfono" id="Teléfono" value="00000000"><br><br>

    <input type="submit">

</fieldset> 

<br><br>

<fieldset>

    <h3>Requisitos para Matricular</h3>

    <input type="checkbox" name="Requisito" id="Requisito" value="Constancia Bautizmal">
    <label for="Constancia">Constancia Bautismal</label> <br><br>
    <input type="checkbox" name="Requisito" id="Requisito" value="I Nivel">
    <label for="I Nivel">I Nivel</label><br><br>
    <input type="checkbox" name="Requisito" id="Requisito" value="II Nivel">
    <label for="II Nivel">II Nivel</label><br><br>
    <input type="checkbox" name="Requisito" id="Requisito" value="III Nivel">
    <label for="III Nivel">III Nivel</label><br><br>
    <input type="submit">

</fieldset>

<br><br>

<fieldset>

    <h3>Nivel que desea Matricular</h3>

    <input type="radio" name="Matricula" id="Bautizo" value="Bautizo">
    <label for="Bautismal">Bautismal</label> <br><br>
    <input type="radio" name="Matricula" id="I Nivel" value="I Nivel">
    <label for="I Nivel">I Nivel</label> <br><br>
    <input type="radio" name="Matricula" id="II Nivel" value="II Nivel">
    <label for="II Nivel">II Nivel</label> <br><br>
    <input type="radio" name="Matricula" id="III Nivel" value="III Nivel">
    <label for="III Nivel">III Nivel</label> <br><br>
    <input type="radio" name="Matricula" id="confirma" value="Confirma">
    <label for="Confirma">Confirma</label> <br><br>

    <input type="submit">

</fieldset>

<br><br>

<fieldset>
<h3>¿Como considera usted que es su práctica religiosa?:</h3>

<textarea name="Responder" id="Responder" rows="5" cols="50" placeholder="Escribir un texto"></textarea>

<input type="submit">

</fieldset>
  </form>
    
</main>
<br>
<!--  El pie de la pagia-->
<footer>

    <p>&copy; exclusivo para la Catequesis. Derechos reservados.</p>

</footer>
    
</body>
</html>
